# Deploys the site to GitHub Pages on every push to main, and once a day so the Instagram row
# picks up new posts. Before uploading it refreshes assets/instagram.json from the Behold feed
# (see instagram.config.json); if that fails, the last saved posts are deployed unchanged.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    # 04:17 UTC = 06:17 in Johannesburg, after Behold's daily refresh
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs wait rather than cancel a deployment in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh Instagram posts
        run: node scripts/instagram.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
